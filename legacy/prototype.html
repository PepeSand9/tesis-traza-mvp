<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Trazá — MVP</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossOrigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Instrument+Serif&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
/* Trazá — estilos globales */
:root {
  --bg: #FAFAF7;
  --bg-panel: #FFFFFF;
  --bg-sunken: #F3F3EE;
  --border: #E6E5DE;
  --border-strong: #D6D4CB;
  --text: #1A1A17;
  --text-muted: #6B6A62;
  --text-soft: #96948A;
  --accent: #2D5F4E;       /* verde clínico profundo */
  --accent-soft: #E8EFEB;
  --accent-ink: #1B3C30;
  --warn: #B8740A;
  --warn-soft: #FBF1DF;
  --error: #A63333;
  --error-soft: #F8E4E0;
  --ok: #2D6A4F;
  --ok-soft: #E0EDE5;
  --radius: 10px;
  --radius-sm: 6px;
  --shadow-sm: 0 1px 2px rgba(25, 25, 20, 0.04);
  --shadow: 0 2px 8px rgba(25, 25, 20, 0.06);
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'JetBrains Mono', ui-monospace, Menlo, monospace;
  --font-serif: 'Instrument Serif', Georgia, serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: var(--font-sans);
  background: var(--bg);
  color: var(--text);
  font-size: 14px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: grid;
  grid-template-columns: 240px 1fr;
  min-height: 100vh;
}

/* Sidebar */
.sidebar {
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  padding: 24px 16px;
  display: flex;
  flex-direction: column;
  gap: 4px;
  position: sticky;
  top: 0;
  height: 100vh;
}
.brand {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 0 8px 24px 8px;
  margin-bottom: 8px;
  border-bottom: 1px solid var(--border);
}
.brand-mark {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 400;
  color: var(--accent);
  letter-spacing: -0.02em;
  line-height: 1;
}
.brand-sub {
  font-size: 10px;
  color: var(--text-soft);
  text-transform: uppercase;
  letter-spacing: 0.12em;
}
.nav-section {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.12em;
  color: var(--text-soft);
  padding: 16px 12px 8px 12px;
  font-weight: 500;
}
.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.12s;
  font-weight: 500;
  font-size: 13.5px;
  user-select: none;
  position: relative;
}
.nav-item:hover { background: var(--bg-sunken); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent-ink);
}
.nav-item .nav-icon { width: 16px; height: 16px; flex-shrink: 0; }
.nav-item .nav-badge {
  margin-left: auto;
  background: var(--error);
  color: white;
  font-size: 10.5px;
  font-weight: 600;
  padding: 1px 6px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.nav-item.disabled {
  opacity: 0.4;
  cursor: not-allowed;
  pointer-events: none;
}
.nav-item.disabled::after {
  content: 'Próximo';
  position: absolute;
  right: 12px;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-soft);
  font-weight: 400;
}
.sidebar-footer {
  margin-top: auto;
  padding: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
}
.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  background: var(--accent);
  color: white;
  display: grid; place-items: center;
  font-weight: 600;
  font-size: 12px;
}
.user-name { font-weight: 600; font-size: 13px; }
.user-role { font-size: 11.5px; color: var(--text-soft); }

/* Main */
.main {
  padding: 40px 48px;
  max-width: 1280px;
  width: 100%;
}
.page-head {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  margin-bottom: 32px;
  gap: 24px;
}
.page-title {
  font-family: var(--font-serif);
  font-size: 40px;
  font-weight: 400;
  margin: 0;
  letter-spacing: -0.02em;
  color: var(--text);
}
.page-subtitle {
  color: var(--text-muted);
  margin-top: 6px;
  font-size: 14px;
  max-width: 600px;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: white;
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.12s;
}
.btn:hover { background: var(--bg-sunken); }
.btn-primary {
  background: var(--accent);
  color: white;
  border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-ink); }
.btn-ghost { border-color: transparent; background: transparent; }
.btn-ghost:hover { background: var(--bg-sunken); }
.btn-sm { padding: 6px 10px; font-size: 12px; }
.btn-danger { color: var(--error); border-color: transparent; }
.btn-danger:hover { background: var(--error-soft); }

/* Cards / panels */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
}

/* Stats row */
.stats {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
  margin-bottom: 24px;
}
.stat {
  padding: 16px 18px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.stat-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-soft);
  font-weight: 500;
}
.stat-value {
  font-family: var(--font-serif);
  font-size: 32px;
  font-weight: 400;
  margin-top: 6px;
  line-height: 1.1;
  letter-spacing: -0.02em;
}
.stat-value.error { color: var(--error); }
.stat-value.warn { color: var(--warn); }
.stat-value.ok { color: var(--ok); }

/* Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.02em;
}
.badge-dot { width: 6px; height: 6px; border-radius: 50%; }
.badge-ok { background: var(--ok-soft); color: var(--ok); }
.badge-ok .badge-dot { background: var(--ok); }
.badge-warn { background: var(--warn-soft); color: var(--warn); }
.badge-warn .badge-dot { background: var(--warn); }
.badge-error { background: var(--error-soft); color: var(--error); }
.badge-error .badge-dot { background: var(--error); }
.badge-neutral { background: var(--bg-sunken); color: var(--text-muted); }
.badge-neutral .badge-dot { background: var(--text-soft); }

/* Uploader */
.upload-zone {
  border: 2px dashed var(--border-strong);
  border-radius: var(--radius);
  padding: 48px 24px;
  text-align: center;
  background: var(--bg-panel);
  transition: all 0.15s;
  cursor: pointer;
}
.upload-zone:hover, .upload-zone.drag {
  border-color: var(--accent);
  background: var(--accent-soft);
}
.upload-icon {
  width: 48px; height: 48px;
  margin: 0 auto 12px;
  color: var(--text-soft);
}
.upload-zone.drag .upload-icon { color: var(--accent); }
.upload-title {
  font-size: 16px;
  font-weight: 600;
  margin-bottom: 4px;
}
.upload-hint {
  color: var(--text-muted);
  font-size: 13px;
}
.upload-formats {
  display: inline-flex;
  gap: 6px;
  margin-top: 12px;
  flex-wrap: wrap;
  justify-content: center;
}
.upload-formats .fmt {
  font-family: var(--font-mono);
  font-size: 10.5px;
  padding: 2px 8px;
  background: var(--bg-sunken);
  border-radius: 4px;
  color: var(--text-muted);
}

/* File list */
.file-list {
  margin-top: 24px;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.file-row {
  display: grid;
  grid-template-columns: 44px 1fr auto auto auto;
  gap: 14px;
  align-items: center;
  padding: 12px 16px;
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: all 0.12s;
  cursor: pointer;
}
.file-row:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
.file-row.open { border-color: var(--accent); }
.file-thumb {
  width: 44px; height: 44px;
  border-radius: 6px;
  background: var(--bg-sunken);
  display: grid; place-items: center;
  color: var(--text-muted);
  font-family: var(--font-mono);
  font-size: 10px;
  font-weight: 600;
  overflow: hidden;
  border: 1px solid var(--border);
}
.file-thumb img { width: 100%; height: 100%; object-fit: cover; }
.file-main { min-width: 0; }
.file-name {
  font-weight: 600;
  font-size: 13.5px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.file-meta {
  font-size: 12px;
  color: var(--text-soft);
  margin-top: 2px;
}
.file-status {
  min-width: 120px;
  display: flex;
  justify-content: flex-end;
}

/* Analysis panel */
.analysis-detail {
  margin-top: 24px;
  display: grid;
  grid-template-columns: 1.1fr 1fr;
  gap: 16px;
}
.doc-preview {
  padding: 0;
  overflow: hidden;
  min-height: 500px;
  display: flex;
  flex-direction: column;
}
.doc-preview-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.doc-preview-body {
  flex: 1;
  overflow: auto;
  background: var(--bg-sunken);
  padding: 16px;
  display: grid;
  place-items: start center;
}
.doc-preview-body img, .doc-preview-body canvas {
  max-width: 100%;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  background: white;
}
.doc-preview-body pre {
  background: white;
  padding: 16px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  max-width: 100%;
  overflow: auto;
  font-size: 11.5px;
  color: var(--text-muted);
  white-space: pre-wrap;
  width: 100%;
}

.analysis-result {
  padding: 0;
  display: flex;
  flex-direction: column;
}
.analysis-head {
  padding: 14px 18px;
  border-bottom: 1px solid var(--border);
}
.analysis-head h3 {
  margin: 0;
  font-size: 14px;
  font-weight: 600;
}
.analysis-body { padding: 16px 18px; overflow-y: auto; flex: 1; }

.analysis-summary {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.summary-cell {
  padding: 10px;
  border-radius: var(--radius-sm);
  text-align: center;
  border: 1px solid var(--border);
}
.summary-cell .n {
  font-family: var(--font-serif);
  font-size: 28px;
  line-height: 1;
  font-weight: 400;
}
.summary-cell .l {
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-soft);
  margin-top: 4px;
  font-weight: 500;
}
.summary-cell.ok .n { color: var(--ok); }
.summary-cell.warn .n { color: var(--warn); }
.summary-cell.err .n { color: var(--error); }

/* Findings list */
.finding {
  padding: 14px;
  border-radius: var(--radius-sm);
  margin-bottom: 10px;
  border-left: 3px solid var(--border-strong);
  background: var(--bg-sunken);
}
.finding.sev-error { border-left-color: var(--error); background: #FCF0EE; }
.finding.sev-warn { border-left-color: var(--warn); background: #FBF5E9; }
.finding.sev-ok { border-left-color: var(--ok); background: #EDF5EF; }
.finding.sev-info { border-left-color: #5B7184; background: #EEF1F4; }
.finding-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 4px;
}
.finding-title { font-weight: 600; font-size: 13px; }
.finding-body { font-size: 12.5px; color: var(--text-muted); line-height: 1.55; }
.finding-body code {
  font-family: var(--font-mono);
  font-size: 11.5px;
  background: rgba(0,0,0,0.05);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--text);
}
.finding-action {
  margin-top: 8px;
  font-size: 12px;
  color: var(--text);
  font-weight: 500;
}

/* Errors Table */
.errors-toolbar {
  display: flex;
  gap: 10px;
  align-items: center;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.filter-chip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 5px 12px;
  border-radius: 20px;
  font-size: 12px;
  font-weight: 500;
  border: 1px solid var(--border-strong);
  background: white;
  color: var(--text-muted);
  cursor: pointer;
  transition: all 0.1s;
}
.filter-chip:hover { background: var(--bg-sunken); }
.filter-chip.active {
  background: var(--text);
  color: white;
  border-color: var(--text);
}
.filter-chip .count {
  background: rgba(0,0,0,0.08);
  padding: 0 6px;
  border-radius: 10px;
  font-size: 10.5px;
  font-weight: 600;
}
.filter-chip.active .count { background: rgba(255,255,255,0.2); }

.errors-table {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.errors-table table {
  width: 100%;
  border-collapse: collapse;
}
.errors-table th {
  text-align: left;
  padding: 12px 16px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-soft);
  font-weight: 600;
  border-bottom: 1px solid var(--border);
  background: var(--bg-sunken);
}
.errors-table td {
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  vertical-align: top;
}
.errors-table tr:last-child td { border-bottom: none; }
.errors-table tr:hover td { background: var(--bg-sunken); }
.err-file {
  font-family: var(--font-mono);
  font-size: 11.5px;
  color: var(--text-muted);
}
.err-msg { font-weight: 500; }
.err-hint {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}

.empty {
  padding: 64px 24px;
  text-align: center;
  color: var(--text-muted);
}
.empty-icon {
  width: 48px; height: 48px;
  margin: 0 auto 12px;
  color: var(--text-soft);
  opacity: 0.6;
}
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 4px; }

/* Progress */
.progress-bar {
  height: 4px;
  background: var(--border);
  border-radius: 2px;
  overflow: hidden;
  margin-top: 4px;
}
.progress-fill {
  height: 100%;
  background: var(--accent);
  transition: width 0.3s;
}

/* Spinner */
@keyframes spin { to { transform: rotate(360deg); } }
.spinner {
  width: 14px; height: 14px;
  border: 2px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  display: inline-block;
}

/* Document pages with highlight overlay */
.doc-preview-body {
  display: flex !important;
  flex-direction: column;
  gap: 16px;
  align-items: center;
}
.doc-page-wrap {
  width: 100%;
  max-width: 560px;
  position: relative;
}
.doc-page {
  position: relative;
  background: white;
  border: 1px solid var(--border);
  box-shadow: var(--shadow);
  width: 100%;
  overflow: hidden;
}
.doc-page img {
  width: 100%;
  height: auto;
  display: block;
  border: none !important;
  box-shadow: none !important;
}
.doc-overlay {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
.highlight-rect {
  fill: transparent;
  stroke-width: 2.5;
  transition: all 0.25s ease;
}
.highlight-rect.sev-error {
  stroke: #D63838;
  fill: rgba(214, 56, 56, 0.12);
}
.highlight-rect.sev-warn {
  stroke: #C4850F;
  fill: rgba(196, 133, 15, 0.12);
}
.highlight-rect.active {
  stroke-width: 3.5;
  fill: rgba(214, 56, 56, 0.25);
  filter: drop-shadow(0 0 6px rgba(214, 56, 56, 0.5));
}
.highlight-rect.dim {
  opacity: 0.25;
}
.doc-page-num {
  position: absolute;
  top: 6px;
  right: 8px;
  background: rgba(0,0,0,0.6);
  color: white;
  font-size: 10px;
  padding: 2px 8px;
  border-radius: 10px;
  font-family: var(--font-mono);
}
.doc-preview-legend {
  padding: 10px 18px;
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 11px;
  color: var(--text-muted);
}
.legend-swatch {
  width: 10px;
  height: 10px;
  border-radius: 3px;
  margin-right: -4px;
}
.legend-swatch.err { background: rgba(214, 56, 56, 0.3); border: 2px solid #D63838; }
.legend-swatch.warn { background: rgba(196, 133, 15, 0.3); border: 2px solid #C4850F; margin-left: 8px; }

/* Clickable/active findings */
.finding.clickable { cursor: pointer; transition: all 0.15s; }
.finding.clickable:hover { transform: translateX(2px); }
.finding.active {
  box-shadow: 0 0 0 2px var(--error);
  transform: translateX(2px);
}
.finding-loc {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10.5px;
  color: var(--error);
  font-weight: 500;
  background: rgba(214, 56, 56, 0.1);
  padding: 2px 7px;
  border-radius: 10px;
}

/* Code suggestion card */
.suggestion {
  margin-top: 10px;
  padding: 12px;
  background: white;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
}
.suggestion-label {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 10.5px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  font-weight: 600;
  color: var(--accent);
  margin-bottom: 8px;
}
.suggestion-card {
  display: flex;
  align-items: baseline;
  gap: 12px;
  padding: 10px 12px;
  background: var(--accent-soft);
  border-radius: var(--radius-sm);
  border: 1px solid rgba(45, 95, 78, 0.15);
}
.suggestion-code {
  font-family: var(--font-mono);
  font-size: 18px;
  font-weight: 700;
  color: var(--accent-ink);
  letter-spacing: 0.02em;
  flex-shrink: 0;
}
.suggestion-desc {
  font-size: 12.5px;
  color: var(--text);
  line-height: 1.4;
}
.suggestion-note {
  margin-top: 8px;
  font-size: 11.5px;
  color: var(--text-soft);
  font-style: italic;
}

/* Tweaks panel */
  position: fixed;
  bottom: 20px;
  right: 20px;
  background: white;
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: 0 8px 24px rgba(0,0,0,0.12);
  padding: 14px 16px;
  width: 260px;
  z-index: 100;
}
.tweaks h4 {
  margin: 0 0 8px 0;
  font-size: 12px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-soft);
}
.tweaks label {
  display: block;
  font-size: 12px;
  margin-bottom: 10px;
}
.tweaks button {
  font-size: 11px;
  padding: 4px 8px;
  margin-right: 4px;
  border: 1px solid var(--border);
  background: white;
  border-radius: 4px;
  cursor: pointer;
}
.tweaks button.on { background: var(--accent); color: white; border-color: var(--accent); }

</style>

<!-- PDF.js (via unpkg legacy build) -->
<script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
<!-- Tesseract.js (OCR) -->

<script>

  { key: 'diagnostico', labels: ['diagnóstico', 'dx'], severity: 'error' },
];

// Mapa de procedimientos (keywords) → código sugerido
// Cargado desde nomenclador_data.js (generado automáticamente desde las 18 hojas oficiales Swiss).
// Si aún no se cargó, se usa un fallback vacío.
window.TRAZA_PROC_KEYWORDS = window.TRAZA_PROC_KEYWORDS || [];

// =============================================================
// EXTRACCIÓN DE TEXTO (PDF + OCR)
// =============================================================

window.extractText = async function(file, onProgress) {
  const type = file.type;
  if (type === 'application/pdf') return extractFromPdf(file, onProgress);
  if (type.startsWith('image/')) return extractFromImage(file, onProgress);
  throw new Error('Formato no soportado: ' + type);
};

async function extractFromPdf(file, onProgress) {
  onProgress?.({ progress: 0.1, message: 'Leyendo PDF...' });
  const arrayBuffer = await file.arrayBuffer();
  const pdfjsLib = window.pdfjsLib;
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;

  let allText = '';
  const thumbnails = [];
  let ocrWords = []; // SIEMPRE completamos bboxes por página (desde texto embebido o OCR)

  for (let p = 1; p <= pdf.numPages; p++) {
    const page = await pdf.getPage(p);
    const SCALE = 1.8;
    const viewport = page.getViewport({ scale: SCALE });

    const textContent = await page.getTextContent();
    const pageText = textContent.items.map(i => i.str).join(' ');
    allText += pageText + '\n';

    const canvas = document.createElement('canvas');
    canvas.width = viewport.width;
    canvas.height = viewport.height;
    await page.render({ canvasContext: canvas.getContext('2d'), viewport }).promise;
    thumbnails.push({ dataUrl: canvas.toDataURL('image/png'), width: canvas.width, height: canvas.height });

    // Convertir items del texto embebido a "words" con bbox en coords del canvas
    if (pageText.trim().length > 20) {
      const pageWords = [];
      for (const item of textContent.items) {
        if (!item.str || !item.str.trim()) continue;
        const tx = item.transform; // [a, b, c, d, e, f] en coords PDF
        // Aplicar viewport.transform para obtener coords del canvas
        const m = window.pdfjsLib.Util.transform(viewport.transform, tx);
        // m = [a, b, c, d, e, f]; en canvas: origen arriba-izquierda
        // Altura de la línea: magnitud de la columna Y del transform final
        const fontHeight = Math.hypot(m[2], m[3]);
        const widthPdf = item.width || (item.str.length * (Math.abs(tx[0]) || 12) * 0.5);
        const widthCanvas = widthPdf * SCALE;
        // En coords PDF el origen del texto es la baseline-izq; al transformar, m[4], m[5] es el origen en canvas
        const baseX = m[4];
        const baseY = m[5];
        // Bbox: desde baseline sube fontHeight
        const x0 = baseX;
        const y0 = baseY - fontHeight;
        const x1 = baseX + widthCanvas;
        const y1 = baseY;
        // Partir en palabras individuales
        const tokens = item.str.split(/\s+/).filter(t => t.length > 0);
        if (tokens.length === 0) continue;
        const totalChars = item.str.length || 1;
        let cursor = 0;
        for (const tok of tokens) {
          const wx0 = x0 + (cursor / totalChars) * widthCanvas;
          const wx1 = x0 + ((cursor + tok.length) / totalChars) * widthCanvas;
          pageWords.push({
            text: tok,
            bbox: { x0: wx0, y0, x1: wx1, y1 },
          });
          cursor += tok.length + 1;
        }
      }
      ocrWords.push({ page: p - 1, words: pageWords, width: canvas.width, height: canvas.height });
    }

    onProgress?.({ progress: 0.1 + 0.3 * (p / pdf.numPages), message: `Procesando página ${p}/${pdf.numPages}...` });
  }

  let method = 'pdf-text';
  if (allText.trim().length < 50) {
    method = 'ocr';
    allText = '';
    ocrWords = [];
    for (let i = 0; i < thumbnails.length; i++) {
      const res = await ocrImageWithWords(thumbnails[i].dataUrl, (p) => {
        onProgress?.({ progress: 0.4 + 0.55 * ((i + p) / thumbnails.length), message: `OCR página ${i+1}/${thumbnails.length}` });
      });
      allText += res.text + '\n';
      ocrWords.push({ page: i, words: res.words, width: thumbnails[i].width, height: thumbnails[i].height });
    }
  }

  onProgress?.({ progress: 1, message: 'Listo' });
  return { text: allText, thumbnails, method, ocrWords };
}

async function extractFromImage(file, onProgress) {
  onProgress?.({ progress: 0.1, message: 'Cargando imagen...' });
  const dataUrl = await fileToDataUrl(file);
  const dim = await imageDimensions(dataUrl);
  onProgress?.({ progress: 0.2, message: 'Aplicando OCR...' });
  const res = await ocrImageWithWords(dataUrl, (p) => {
    onProgress?.({ progress: 0.2 + 0.75 * p, message: 'Reconociendo texto...' });
  });
  onProgress?.({ progress: 1, message: 'Listo' });
  return {
    text: res.text,
    thumbnails: [{ dataUrl, width: dim.width, height: dim.height }],
    method: 'ocr',
    ocrWords: [{ page: 0, words: res.words, width: dim.width, height: dim.height }],
  };
}

function imageDimensions(dataUrl) {
  return new Promise(r => {
    const img = new Image();
    img.onload = () => r({ width: img.naturalWidth, height: img.naturalHeight });
    img.src = dataUrl;
  });
}

function fileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const r = new FileReader();
    r.onload = () => resolve(r.result);
    r.onerror = reject;
    r.readAsDataURL(file);
  });
}

async function ocrImageWithWords(dataUrl, onProg) {
  const Tesseract = window.Tesseract;
  const { data } = await Tesseract.recognize(dataUrl, 'spa', {
    logger: (m) => {
      if (m.status === 'recognizing text' && onProg) onProg(m.progress || 0);
    }
  });
  return {
    text: data.text,
    words: (data.words || []).map(w => ({
      text: w.text,
      bbox: w.bbox, // { x0, y0, x1, y1 }
      confidence: w.confidence,
    })),
  };
}

function stripAccents(s) {
  return s.normalize('NFD').replace(/[\u0300-\u036f]/g, '');
}

// Busca los bounding boxes en las palabras OCR/PDF que componen una frase
// Soporta needles multi-palabra: busca secuencias consecutivas de palabras
function findSpans(needle, ocrPages) {
  if (!ocrPages || !needle) return [];
  const needleTokens = stripAccents(needle.toLowerCase())
    .replace(/[^\w\s.\-]/g, ' ')
    .split(/\s+/)
    .filter(t => t.length > 0);
  if (needleTokens.length === 0) return [];

  const spans = [];
  for (const page of ocrPages) {
    const words = page.words || [];
    for (let i = 0; i <= words.length - needleTokens.length; i++) {
      let matched = true;
      for (let j = 0; j < needleTokens.length; j++) {
        const wordText = stripAccents((words[i + j].text || '').toLowerCase())
          .replace(/[^\w.\-]/g, '');
        const nt = needleTokens[j];
        // Match exacto, o la palabra contiene el token (p.ej. "cesárea," matchea "cesárea")
        if (wordText !== nt && !wordText.includes(nt) && !nt.includes(wordText)) {
          matched = false;
          break;
        }
      }
      if (matched) {
        // Unir bboxes de las palabras consecutivas en un único span
        const bboxes = [];
        for (let j = 0; j < needleTokens.length; j++) bboxes.push(words[i + j].bbox);
        const x0 = Math.min(...bboxes.map(b => b.x0));
        const y0 = Math.min(...bboxes.map(b => b.y0));
        const x1 = Math.max(...bboxes.map(b => b.x1));
        const y1 = Math.max(...bboxes.map(b => b.y1));
        spans.push({
          page: page.page,
          bbox: { x0, y0, x1, y1 },
          canvasWidth: page.width,
          canvasHeight: page.height,
        });
        i += needleTokens.length - 1; // saltar las palabras ya matcheadas
      }
    }
  }
  return spans;
}

window.analyzeDocument = function(text, fileName, ocrWords) {
  const lower = stripAccents(text.toLowerCase());
  const findings = [];

  // 1. CAMPOS PRESENTES
  const foundFields = {};
  for (const field of window.TRAZA_REQUIRED_FIELDS) {
    const hit = field.labels.find(l => lower.includes(stripAccents(l.toLowerCase())));
    if (hit) foundFields[field.key] = true;
  }

  // 2. DETECTAR PROCEDIMIENTO MENCIONADO (por keyword)
  let procedureGuess = null;
  for (const entry of window.TRAZA_PROC_KEYWORDS) {
    for (const kw of entry.keywords) {
      if (lower.includes(stripAccents(kw.toLowerCase()))) {
        procedureGuess = { keyword: kw, code: entry.code, desc: window.TRAZA_NOMENCLADOR_FULL[entry.code]?.desc };
        break;
      }
    }
    if (procedureGuess) break;
  }

  // 3. DETECTAR CÓDIGOS DE NOMENCLADOR EN TEXTO
  // Matchea formatos: NNNNNN, NN.NN.NN, NN-NN-NN
  const codeRegex = /\b(\d{2}[.\-]\d{2}[.\-]\d{2}|\d{4,6})\b/g;
  const rawCodes = [...new Set([...text.matchAll(codeRegex)].map(m => m[1]))];
  const validCodes = [];
  for (const raw of rawCodes) {
    // Normalizar separadores a punto para buscar en el diccionario
    const normalized = raw.replace(/-/g, '.');
    if (window.TRAZA_NOMENCLADOR_FULL[normalized]) validCodes.push(normalized);
    else if (window.TRAZA_NOMENCLADOR_FULL[raw]) validCodes.push(raw);
  }

  // Si hay código válido → OK
  if (validCodes.length > 0) {
    for (const code of validCodes) {
      findings.push({
        severity: 'ok',
        code: `CODE_OK_${code}`,
        title: `Código ${code} válido`,
        body: `${window.TRAZA_NOMENCLADOR_FULL[code].desc} — reconocido en el nomenclador de Swiss Medical.`,
        spans: findSpans(code, ocrWords),
      });
    }
  } else {
    // No hay código → error con sugerencia inteligente si detectamos procedimiento
    if (procedureGuess) {
      findings.push({
        severity: 'error',
        code: 'NO_CODE_SUGGEST',
        title: 'Falta el código de nomenclador',
        body: `El documento menciona "${procedureGuess.keyword}" pero no incluye el código correspondiente. Sin código la prepaga no puede procesar la liquidación.`,
        action: `Agregar código ${procedureGuess.code} — ${procedureGuess.desc}.`,
        suggestion: { code: procedureGuess.code, desc: procedureGuess.desc },
        spans: findSpans(procedureGuess.keyword, ocrWords),
      });
    } else {
      findings.push({
        severity: 'error',
        code: 'NO_CODE',
        title: 'Falta el código de nomenclador',
        body: `No se detectó un código de facturación en el documento. Sin código la prepaga no puede procesar la liquidación.`,
        action: 'Agregar el código correspondiente del nomenclador de la prepaga.',
      });
    }
  }

  // 4. CAMPOS FALTANTES (verificables)
  for (const field of window.TRAZA_REQUIRED_FIELDS) {
    // El campo "codigo" ya se reportó arriba — skip
    if (field.key === 'codigo') continue;
    if (!foundFields[field.key]) {
      findings.push({
        severity: field.severity,
        code: `MISSING_${field.key.toUpperCase()}`,
        title: `Falta ${fieldLabel(field.key)}`,
        body: `No se detecta el campo "${field.labels[0]}" en el documento. Este campo es requerido por las prepagas para procesar la liquidación.`,
        action: `Agregar ${fieldLabel(field.key)} al documento antes de presentar.`,
      });
    }
  }

  // 5. PREPAGAS / SANATORIOS DETECTADOS
  const prepagasDetectadas = window.TRAZA_PREPAGAS.filter(p => lower.includes(stripAccents(p.toLowerCase())));
  const sanatoriosDetectados = window.TRAZA_SANATORIOS.filter(s => lower.includes(stripAccents(s.toLowerCase())));

  // 6. FECHAS + PLAZO
  const fechaRegex = /\b(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})\b/g;
  const fechas = [...text.matchAll(fechaRegex)].map(m => m[0]);
  if (fechas.length > 0) {
    try {
      const fechaStr = fechas[0];
      const parts = fechaStr.split(/[\/\-]/).map(Number);
      let [d, m, y] = parts;
      if (y < 100) y += 2000;
      const fechaPractica = new Date(y, m - 1, d);
      const hoy = new Date();
      const diasDesde = Math.floor((hoy - fechaPractica) / 86400000);
      const plazoLimite = 60;
      if (diasDesde > plazoLimite) {
        findings.push({
          severity: 'error',
          code: 'PLAZO_VENCIDO',
          title: 'Plazo de presentación posiblemente vencido',
          body: `La fecha detectada (${fechaStr}) es de hace ${diasDesde} días. El plazo estándar de re-facturación es de 60 días.`,
          action: 'Verificar con la prepaga si la presentación es aún admisible.',
          spans: findSpans(fechaStr, ocrWords),
        });
      } else if (diasDesde > 30) {
        findings.push({
          severity: 'warn',
          code: 'PLAZO_CERCANO',
          title: 'Plazo de presentación próximo',
          body: `La fecha detectada (${fechaStr}) es de hace ${diasDesde} días. Quedan ${plazoLimite - diasDesde} días hasta el vencimiento.`,
          action: 'Presentar la liquidación en los próximos días.',
          spans: findSpans(fechaStr, ocrWords),
        });
      } else {
        findings.push({
          severity: 'ok',
          code: 'PLAZO_OK',
          title: 'Dentro del plazo de presentación',
          body: `La fecha detectada (${fechaStr}) está dentro del plazo normal de 60 días.`,
        });
      }
    } catch (e) {}
  }

  // 7. LEGIBILIDAD
  const wordCount = text.split(/\s+/).filter(w => w.length > 2).length;
  if (wordCount < 20) {
    findings.push({
      severity: 'warn',
      code: 'LOW_CONTENT',
      title: 'Contenido escaso o ilegible',
      body: `Solo se pudieron reconocer ${wordCount} palabras. El documento puede estar mal escaneado o incompleto.`,
      action: 'Re-escanear en mayor resolución o solicitar copia legible.',
    });
  }

  const summary = {
    ok: findings.filter(f => f.severity === 'ok').length,
    warn: findings.filter(f => f.severity === 'warn').length,
    error: findings.filter(f => f.severity === 'error').length,
  };
  const overall = summary.error > 0 ? 'error' : summary.warn > 0 ? 'warn' : 'ok';

  return {
    findings,
    summary,
    overall,
    detected: {
      codes: validCodes,
      prepagas: prepagasDetectadas,
      sanatorios: sanatoriosDetectados,
      fechas: fechas.slice(0, 3),
      procedureGuess,
    },
    fileName,
    analyzedAt: new Date().toISOString(),
  };
};

function fieldLabel(key) {
  return {
    prepaga: 'prepaga / obra social',
    fecha: 'fecha',
    procedimiento: 'procedimiento',
    codigo: 'código de nomenclador',
    sanatorio: 'sanatorio / institución',
    anestesia: 'tipo de anestesia',
    diagnostico: 'diagnóstico',
  }[key] || key;
}

</script>

<!-- Upload view -->
<script type="text/babel">
// Trazá — Upload view

function UploadView({ files, onAddFile, onRemoveFile, onSelectFile, selectedFileId }) {
  const [drag, setDrag] = React.useState(false);
  const [uploading, setUploading] = React.useState(null);
  const inputRef = React.useRef();

  const ACCEPT = 'application/pdf,image/png,image/jpeg,image/jpg,image/webp';

  async function handleFiles(fileList) {
    for (const file of fileList) {
      const id = 'f_' + Date.now() + '_' + Math.random().toString(36).slice(2, 6);
      const entry = {
        id,
        name: file.name,
        size: file.size,
        type: file.type,
        addedAt: new Date().toISOString(),
        status: 'analyzing',
        progress: 0,
        progressMessage: 'Iniciando...',
      };
      onAddFile(entry);
      setUploading(id);

      try {
        const { text, thumbnails, method, ocrWords } = await window.extractText(file, (p) => {
          onAddFile({ ...entry, progress: p.progress, progressMessage: p.message });
        });

        const analysis = window.analyzeDocument(text, file.name, ocrWords);

        onAddFile({
          ...entry,
          status: 'analyzed',
          progress: 1,
          text,
          thumbnails,
          method,
          ocrWords,
          analysis,
        });
      } catch (err) {
        console.error(err);
        onAddFile({
          ...entry,
          status: 'error',
          errorMessage: err.message || 'Error procesando archivo',
        });
      }
      setUploading(null);
    }
  }

  const selected = files.find(f => f.id === selectedFileId);

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">Cargar documentos</h1>
          <p className="page-subtitle">Subí parte quirúrgico, autorizaciones u otra documentación. Trazá detecta automáticamente errores comunes antes de que presentes.</p>
        </div>
        {files.length > 0 && (
          <button className="btn" onClick={() => inputRef.current?.click()}>
            <window.Icon name="upload" size={14} /> Subir más
          </button>
        )}
      </div>

      {files.length === 0 && (
        <div
          className={`upload-zone ${drag ? 'drag' : ''}`}
          onDragOver={(e) => { e.preventDefault(); setDrag(true); }}
          onDragLeave={() => setDrag(false)}
          onDrop={(e) => {
            e.preventDefault();
            setDrag(false);
            handleFiles(Array.from(e.dataTransfer.files));
          }}
          onClick={() => inputRef.current?.click()}
        >
          <div className="upload-icon"><window.Icon name="upload" size={48} /></div>
          <div className="upload-title">Arrastrá archivos acá o hacé click para subir</div>
          <div className="upload-hint">Trazá analiza cada documento y detecta errores antes de que presentes</div>
          <div className="upload-formats">
            <span className="fmt">PDF</span>
            <span className="fmt">PNG</span>
            <span className="fmt">JPG</span>
            <span className="fmt">JPEG</span>
            <span className="fmt">WEBP</span>
          </div>
        </div>
      )}

      <input
        ref={inputRef}
        type="file"
        accept={ACCEPT}
        multiple
        style={{ display: 'none' }}
        onChange={(e) => handleFiles(Array.from(e.target.files))}
      />

      {files.length > 0 && (
        <div className="file-list">
          {files.map(f => <FileRow key={f.id} file={f}
            onClick={() => onSelectFile(f.id)}
            onRemove={() => onRemoveFile(f.id)}
            isSelected={f.id === selectedFileId} />)}
        </div>
      )}

      {selected && selected.status === 'analyzed' && (
        <AnalysisDetail file={selected} />
      )}
    </div>
  );
}

function FileRow({ file, onClick, onRemove, isSelected }) {
  const ext = file.name.split('.').pop().toUpperCase();
  const size = (file.size / 1024).toFixed(0) + ' KB';
  return (
    <div className={`file-row ${isSelected ? 'open' : ''}`} onClick={onClick}>
      <div className="file-thumb">
        {file.thumbnails?.[0] ? <img src={file.thumbnails[0].dataUrl || file.thumbnails[0]} /> : ext}
      </div>
      <div className="file-main">
        <div className="file-name">{file.name}</div>
        <div className="file-meta">
          {size} · {new Date(file.addedAt).toLocaleString('es-AR', { day:'2-digit', month:'short', hour:'2-digit', minute:'2-digit' })}
          {file.method && <> · {file.method === 'ocr' ? 'OCR aplicado' : 'texto PDF'}</>}
        </div>
        {file.status === 'analyzing' && (
          <div style={{ marginTop: 6, fontSize: 11.5, color: 'var(--text-muted)', display:'flex', alignItems:'center', gap:6 }}>
            <span className="spinner"></span>
            {file.progressMessage}
            <div className="progress-bar" style={{ flex: 1, maxWidth: 180 }}>
              <div className="progress-fill" style={{ width: `${(file.progress || 0) * 100}%` }}></div>
            </div>
          </div>
        )}
      </div>
      <div className="file-status">
        {file.status === 'analyzing' && <span className="badge badge-neutral"><span className="badge-dot"></span>Analizando</span>}
        {file.status === 'analyzed' && file.analysis?.overall === 'ok' && <span className="badge badge-ok"><span className="badge-dot"></span>Sin errores</span>}
        {file.status === 'analyzed' && file.analysis?.overall === 'warn' && <span className="badge badge-warn"><span className="badge-dot"></span>{file.analysis.summary.warn} advertencia{file.analysis.summary.warn > 1 ? 's' : ''}</span>}
        {file.status === 'analyzed' && file.analysis?.overall === 'error' && <span className="badge badge-error"><span className="badge-dot"></span>{file.analysis.summary.error} error{file.analysis.summary.error > 1 ? 'es' : ''}</span>}
        {file.status === 'error' && <span className="badge badge-error"><span className="badge-dot"></span>Falló</span>}
      </div>
      <button className="btn btn-sm btn-ghost" onClick={(e) => { e.stopPropagation(); onClick(); }}>
        <window.Icon name="eye" size={12} /> Ver
      </button>
      <button className="btn btn-sm btn-danger" onClick={(e) => { e.stopPropagation(); onRemove(); }}>
        <window.Icon name="trash" size={12} />
      </button>
    </div>
  );
}

function AnalysisDetail({ file }) {
  const { analysis, thumbnails } = file;
  const [activeFindingIdx, setActiveFindingIdx] = React.useState(null);

  const sorted = [...analysis.findings].sort((a, b) => {
    const order = { error: 0, warn: 1, ok: 2 };
    return order[a.severity] - order[b.severity];
  });

  const activeFinding = activeFindingIdx !== null ? sorted[activeFindingIdx] : null;
  const activeSpans = activeFinding?.spans || [];

  // Agrupamos spans por página (solo de error/warn; los OK solo al click)
  const spansByPage = {};
  for (const f of sorted) {
    if (!f.spans) continue;
    if (f.severity === 'ok') continue;
    for (const s of f.spans) {
      (spansByPage[s.page] = spansByPage[s.page] || []).push({ ...s, severity: f.severity });
    }
  }

  return (
    <div className="analysis-detail">
      <div className="panel doc-preview">
        <div className="doc-preview-head">
          <div style={{ fontWeight: 600, fontSize: 13 }}>{file.name}</div>
          <div style={{ fontSize: 11.5, color: 'var(--text-soft)', fontFamily: 'var(--font-mono)' }}>
            {file.method === 'ocr' ? 'OCR · español' : 'PDF · texto embebido'}
          </div>
        </div>
        <div className="doc-preview-body">
          {thumbnails?.map((thumb, i) => (
            <DocPage
              key={i}
              thumb={thumb}
              pageIdx={i}
              spans={spansByPage[i] || []}
              activeSpanBboxes={activeSpans.filter(s => s.page === i).map(s => s.bbox)}
            />
          ))}
          {!thumbnails?.length && <div style={{ padding: 20, color: 'var(--text-soft)', fontSize: 12 }}>Sin preview disponible</div>}
        </div>
        <div className="doc-preview-legend">
          <span className="legend-swatch err"></span> Error
          <span className="legend-swatch warn"></span> Advertencia
          <span style={{ color: 'var(--text-soft)', marginLeft: 'auto' }}>Click un hallazgo para resaltar</span>
        </div>
      </div>

      <div className="panel analysis-result">
        <div className="analysis-head">
          <h3>Resultado del análisis</h3>
          <div style={{ fontSize: 12, color: 'var(--text-muted)', marginTop: 2 }}>
            {analysis.detected.prepagas.length > 0 && <>Prepaga: <b>{analysis.detected.prepagas.join(', ')}</b> · </>}
            {analysis.detected.codes.length > 0
              ? <>Código detectado: <code style={{fontFamily:'var(--font-mono)'}}>{analysis.detected.codes.join(', ')}</code></>
              : <span style={{ color: 'var(--text-soft)' }}>Sin código detectado</span>}
          </div>
        </div>
        <div className="analysis-body">
          <div className="analysis-summary">
            <div className="summary-cell err">
              <div className="n">{analysis.summary.error}</div>
              <div className="l">Errores</div>
            </div>
            <div className="summary-cell warn">
              <div className="n">{analysis.summary.warn}</div>
              <div className="l">Advertencias</div>
            </div>
            <div className="summary-cell ok">
              <div className="n">{analysis.summary.ok}</div>
              <div className="l">OK</div>
            </div>
          </div>

          {sorted.map((f, i) => (
            <div
              key={i}
              className={`finding sev-${f.severity} ${activeFindingIdx === i ? 'active' : ''} ${f.spans?.length ? 'clickable' : ''}`}
              onClick={() => f.spans?.length && setActiveFindingIdx(activeFindingIdx === i ? null : i)}
            >
              <div className="finding-head">
                <span className="finding-title">{f.title}</span>
                {f.spans?.length > 0 && <span className="finding-loc"><window.Icon name="target" size={11} /> en documento</span>}
              </div>
              <div className="finding-body">{f.body}</div>
              {f.suggestion && (
                <div className="suggestion">
                  <div className="suggestion-label">
                    <window.Icon name="sparkles" size={12} /> Sugerencia de Trazá
                  </div>
                  <div className="suggestion-card">
                    <div className="suggestion-code">{f.suggestion.code}</div>
                    <div className="suggestion-desc">{f.suggestion.desc}</div>
                  </div>
                  <div className="suggestion-note">Detectamos el procedimiento en el texto. Este es el código de nomenclador que corresponde.</div>
                </div>
              )}
              {f.action && !f.suggestion && <div className="finding-action">→ {f.action}</div>}
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function DocPage({ thumb, pageIdx, spans, activeSpanBboxes }) {
  // Renderiza la página con overlay de highlights
  // Los bboxes están en coordenadas del canvas original (thumb.width/height)
  const hasActive = activeSpanBboxes.length > 0;
  return (
    <div className="doc-page-wrap">
      <div className="doc-page" style={{ aspectRatio: `${thumb.width} / ${thumb.height}` }}>
        <img src={thumb.dataUrl || thumb} alt={`página ${pageIdx + 1}`} />
        <svg className="doc-overlay" viewBox={`0 0 ${thumb.width} ${thumb.height}`} preserveAspectRatio="none">
          {spans.map((s, i) => {
            const { x0, y0, x1, y1 } = s.bbox;
            const isActive = activeSpanBboxes.some(b => b.x0 === x0 && b.y0 === y0);
            const dim = hasActive && !isActive;
            return (
              <rect
                key={i}
                x={x0 - 4}
                y={y0 - 4}
                width={(x1 - x0) + 8}
                height={(y1 - y0) + 8}
                className={`highlight-rect sev-${s.severity} ${isActive ? 'active' : ''} ${dim ? 'dim' : ''}`}
                rx="3"
              />
            );
          })}
        </svg>
      </div>
      {thumb.thumbnails?.length > 1 && <div className="doc-page-num">Pág {pageIdx + 1}</div>}
    </div>
  );
}

window.UploadView = UploadView;

</script>

<!-- Errors view -->
<script type="text/babel">
// Trazá — Errors view (pestaña consolidada de errores detectados)

function ErrorsView({ files, onOpenFile }) {
  const [filter, setFilter] = React.useState('all');

  // Aplanar findings de todos los archivos analizados
  const allErrors = [];
  for (const f of files) {
    if (!f.analysis) continue;
    for (const finding of f.analysis.findings) {
      if (finding.severity === 'ok') continue; // solo mostramos problemas
      allErrors.push({
        ...finding,
        fileId: f.id,
        fileName: f.name,
        fileDate: f.addedAt,
        prepaga: f.analysis.detected.prepagas[0] || '—',
        codigo: f.analysis.detected.codes[0] || null,
      });
    }
  }

  const counts = {
    all: allErrors.length,
    error: allErrors.filter(e => e.severity === 'error').length,
    warn: allErrors.filter(e => e.severity === 'warn').length,
  };

  const filtered = filter === 'all' ? allErrors : allErrors.filter(e => e.severity === filter);

  // Totales por archivo
  const filesAnalyzed = files.filter(f => f.analysis).length;
  const filesWithErrors = files.filter(f => f.analysis?.overall === 'error').length;

  return (
    <div>
      <div className="page-head">
        <div>
          <h1 className="page-title">Errores detectados</h1>
          <p className="page-subtitle">Historial consolidado de todos los errores encontrados en tus documentos. Corregilos antes de presentar para evitar rechazos.</p>
        </div>
      </div>

      <div className="stats">
        <div className="stat">
          <div className="stat-label">Documentos analizados</div>
          <div className="stat-value">{filesAnalyzed}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Con errores críticos</div>
          <div className="stat-value error">{filesWithErrors}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Errores totales</div>
          <div className="stat-value error">{counts.error}</div>
        </div>
        <div className="stat">
          <div className="stat-label">Advertencias</div>
          <div className="stat-value warn">{counts.warn}</div>
        </div>
      </div>

      <div className="errors-toolbar">
        <div className={`filter-chip ${filter==='all' ? 'active' : ''}`} onClick={() => setFilter('all')}>
          Todos <span className="count">{counts.all}</span>
        </div>
        <div className={`filter-chip ${filter==='error' ? 'active' : ''}`} onClick={() => setFilter('error')}>
          Errores <span className="count">{counts.error}</span>
        </div>
        <div className={`filter-chip ${filter==='warn' ? 'active' : ''}`} onClick={() => setFilter('warn')}>
          Advertencias <span className="count">{counts.warn}</span>
        </div>
      </div>

      {filtered.length === 0 ? (
        <div className="panel empty">
          <div className="empty-icon"><window.Icon name="empty" size={48} /></div>
          <div className="empty-title">
            {allErrors.length === 0 ? 'Todavía no analizaste documentos' : 'Sin resultados para este filtro'}
          </div>
          <div>
            {allErrors.length === 0
              ? 'Subí un documento en la pestaña "Cargar documentos" para empezar'
              : 'Probá con otro filtro'}
          </div>
        </div>
      ) : (
        <div className="errors-table">
          <table>
            <thead>
              <tr>
                <th style={{ width: 80 }}>Sev.</th>
                <th>Problema</th>
                <th style={{ width: 200 }}>Archivo</th>
                <th style={{ width: 130 }}>Prepaga</th>
                <th style={{ width: 100 }}>Código</th>
                <th style={{ width: 100 }}></th>
              </tr>
            </thead>
            <tbody>
              {filtered.map((e, i) => (
                <tr key={i}>
                  <td>
                    {e.severity === 'error' && <span className="badge badge-error"><span className="badge-dot"></span>Error</span>}
                    {e.severity === 'warn' && <span className="badge badge-warn"><span className="badge-dot"></span>Warn</span>}
                    {e.severity === 'info' && <span className="badge badge-neutral"><span className="badge-dot"></span>Manual</span>}
                  </td>
                  <td>
                    <div className="err-msg">{e.title}</div>
                    <div className="err-hint">{e.action || e.body}</div>
                  </td>
                  <td>
                    <div className="err-file">{e.fileName}</div>
                    <div className="err-hint">{new Date(e.fileDate).toLocaleDateString('es-AR')}</div>
                  </td>
                  <td>{e.prepaga}</td>
                  <td>{e.codigo ? <code style={{fontFamily:'var(--font-mono)', fontSize:11.5}}>{e.codigo}</code> : <span style={{color:'var(--text-soft)'}}>—</span>}</td>
                  <td>
                    <button className="btn btn-sm btn-ghost" onClick={() => onOpenFile(e.fileId)}>
                      Ver archivo
                    </button>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

window.ErrorsView = ErrorsView;

</script>

<!-- App root -->
<script type="text/babel" data-presets="react">

function App() {
  const [active, setActive] = React.useState('upload');
  const [files, setFiles] = React.useState([]);
  const [selectedFileId, setSelectedFileId] = React.useState(null);

  function upsertFile(entry) {
    setFiles(prev => {
      const idx = prev.findIndex(f => f.id === entry.id);
      if (idx === -1) return [entry, ...prev];
      const copy = [...prev];
      copy[idx] = entry;
      return copy;
    });
    // Auto-seleccionar cuando termina de analizarse
    if (entry.status === 'analyzed') {
      setSelectedFileId(entry.id);
    }
  }

  function removeFile(id) {
    setFiles(prev => prev.filter(f => f.id !== id));
    if (selectedFileId === id) setSelectedFileId(null);
  }

  function openFile(id) {
    setActive('upload');
    setSelectedFileId(id);
    setTimeout(() => {
      const el = document.querySelector('.analysis-detail');
      if (el) window.scrollTo({ top: el.offsetTop - 24, behavior: 'smooth' });
    }, 100);
  }

  // Contador de errores críticos para badge sidebar
  const errorCount = files.reduce((acc, f) => {
    if (!f.analysis) return acc;
    return acc + f.analysis.summary.error;
  }, 0);

  return (
    <div className="app">
      <window.Sidebar active={active} setActive={setActive} errorCount={errorCount} />
      <main className="main">
        {active === 'upload' && (
          <window.UploadView
            files={files}
            onAddFile={upsertFile}
            onRemoveFile={removeFile}
            onSelectFile={setSelectedFileId}
            selectedFileId={selectedFileId}
          />
        )}
        {active === 'errors' && (
          <window.ErrorsView files={files} onOpenFile={openFile} />
        )}
      </main>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

</script>

</body>
